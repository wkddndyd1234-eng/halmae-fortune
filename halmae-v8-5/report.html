<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>할매의 깊은 장부 · 보고서</title><link rel="stylesheet" href="/v85.css"></head><body><main class="paper"><nav class="no-print"><a href="/">← 홈</a><button onclick="window.print()" id="print" disabled>PDF로 저장 / 인쇄</button></nav><p class="eyebrow">할매의 운명방</p><h1>할매의 깊은 장부</h1><div id="status">발급 권한 확인 중...</div><article id="content"></article><footer><p class="small">전통 명리의 상징을 활용한 자기 성찰용 콘텐츠입니다. 미래·투자·건강·법률 결과를 보장하지 않습니다.</p></footer></main><script>const token=decodeURIComponent(location.hash.slice(1));history.replaceState(null,'',location.pathname);(async()=>{try{if(!token)throw Error('보고서 접근 토큰이 없습니다.');const r=await fetch('/.netlify/functions/report',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'열람 실패');document.querySelector('#status').textContent=j.demo?'관리자 테스트 발급 · 실제 결제 없음':'결제 승인 완료 · 발급 보고서';const root=document.querySelector('#content');const h=document.createElement('h2');h.textContent=j.name+'님의 보고서';root.append(h);for(const ch of j.chapters){const sec=document.createElement('section');const title=document.createElement('h3');title.textContent=ch.title;const body=document.createElement('p');body.textContent=ch.body;sec.append(title,body);root.append(sec)}document.querySelector('#print').disabled=false}catch(e){document.querySelector('#status').textContent=e.message}})();</script></body></html>
