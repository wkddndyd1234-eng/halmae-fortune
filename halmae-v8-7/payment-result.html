<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>테스트 결제 결과 · 할매의 운명방</title>
  <link rel="stylesheet" href="/v85.css">
  <link rel="stylesheet" href="/v88.css">
<link rel="icon" type="image/png" href="/art/favicon.png"><link rel="stylesheet" href="/release.css"><meta name="robots" content="noindex, nofollow"></head>
<body>
<main class="paper">
  <a href="/checkout.html">← 주문 화면으로</a>
  <h1>테스트 결제 결과</h1>
  <p id="status" role="status">결제가 완료됐는지 확인하고 있어요…</p>
  <button id="retry" type="button" hidden>결제 다시 확인</button>
  <p id="order-number" hidden></p>
  <p><a id="recover" href="/recovery.html" hidden>이메일로 테스트 보고서 복구</a></p>
  <section class="ledger-cover ledger-receipt" id="opened-ledger" hidden>
    <span class="ledger-seal" aria-hidden="true">開</span>
    <h2>장부의 봉인이 열렸어요</h2>
    <p id="access">365일 동안 다시 볼 수 있어요. 이 링크는 최대 30분 동안 열 수 있으니 공유하지 마세요.</p>
    <p id="purchase-expiry" hidden></p>
    <a class="ledger-cta" id="report" hidden>장부 표지와 목차 열기</a>
  </section>
  <form id="renew">
    <label>이 브라우저에서 결제한 주문 번호<input name="orderId" maxlength="39" required autocomplete="off"></label>
    <button type="submit">새 열람 링크 받기</button>
  </form>
</main>
<script type="module" src="/payment-result.js"></script>
</body>
</html>
