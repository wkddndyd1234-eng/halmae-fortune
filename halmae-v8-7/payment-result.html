<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>테스트 결제 결과 · 할매의 운명방</title>
  <link rel="stylesheet" href="/v85.css">
</head>
<body>
<main class="paper">
  <a href="/checkout.html">← 주문 화면으로</a>
  <h1>테스트 결제 결과</h1>
  <p id="status" role="status">테스트 승인 상태를 확인하고 있습니다…</p>
  <button id="retry" type="button" hidden>승인 다시 확인</button>
  <p id="order-number" hidden></p>
  <p><a id="recover" href="/recovery.html" hidden>이메일로 테스트 보고서 복구</a></p>
  <p id="access" hidden>아래 링크를 보관하면 승인 시점부터 7일간 다시 열람할 수 있습니다. 링크를 가진 사람이 보고서를 열 수 있으니 공유하지 마세요.</p>
  <p><a id="report" hidden>테스트 보고서 열기</a></p>
</main>
<script type="module" src="/payment-result.js"></script>
</body>
</html>
